name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: trypillia-lsp-linux-x64
          - os: macos-latest
            artifact: trypillia-lsp-macos-arm64
          - os: macos-13
            artifact: trypillia-lsp-macos-x64
          - os: windows-latest
            artifact: trypillia-lsp-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        run: |
          cd build
          tar -czf ${{ matrix.artifact }}.tar.gz trypillia-lsp
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: build/${{ matrix.artifact }}.tar.gz
